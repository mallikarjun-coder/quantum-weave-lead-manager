<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum Weave Lead Manager</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:20px 5%;display:flex;justify-content:space-between}main{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:7px}button{background:#111827;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.ai{white-space:pre-wrap;background:#f3f4f6;padding:15px;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><header><b>Quantum Weave — Lead Manager</b><span>Java + GenAI</span></header><main><div class="card"><h2>Add Lead</h2><form id="f"><div class="grid"><div><label>Name</label><input id="name" maxlength="100" required></div><div><label>Contact</label><input id="contact" maxlength="100" required></div></div><label>Requirement</label><textarea id="requirement" maxlength="1000" required></textarea><label>Status</label><select id="status"><option>NEW</option><option>CONTACTED</option><option>QUALIFIED</option><option>CONVERTED</option><option>LOST</option></select><button>Save Lead</button></form></div><div class="card"><h2>Leads</h2><input id="q" placeholder="Search..." oninput="load()"><table><thead><tr><th>Name</th><th>Contact</th><th>Requirement</th><th>Status</th><th>AI</th></tr></thead><tbody id="rows"></tbody></table><div id="ai"></div></div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let x=q.value,r=await fetch('/api/leads'+(x?'?q='+encodeURIComponent(x):'')),a=await r.json();rows.innerHTML=a.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.contact)}</td><td>${esc(l.requirement)}</td><td>${l.status}</td><td><button onclick="gen(${l.id})">Draft Reply</button></td></tr>`).join('')}async function gen(id){ai.innerHTML='Generating...';let r=await fetch('/api/ai/first-response/'+id,{method:'POST'}),d=await r.json();ai.innerHTML='<div class="ai"><b>AI First Response</b><br>'+esc(d.draft)+'</div>'}f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name: document.getElementById('name').value,
  contact: document.getElementById('contact').value,
  requirement: document.getElementById('requirement').value,
  status: document.getElementById('status').value})});if(r.ok){f.reset();load()}else alert('Validation failed')};load();</script></body></html>
