services:
  - type: web
    name: lead-manager
    runtime: docker
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/lead-manager-0.0.1-SNAPSHOT.jar
    port: 8080
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        scope: build
      - key: DB_USERNAME
        scope: build
      - key: DB_PASSWORD
        scope: build
      - key: OPENAI_API_KEY
        scope: build

  - type: mysql
    name: lead-manager-db
    plan: free
